<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f9">
  <meta name="description" content="Generate clean QR codes for links and text, with optional logo and color customization.">
  <title>QR Code Generator — LonGanancial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <div class="stack">
    <section class="card" aria-labelledby="pageTitle">
      <h1 id="pageTitle">QR code generator</h1>
      <div class="qr-surface" aria-label="QR code preview">
        <div class="qr-paper" id="qrPreview"></div>
      </div>

      <div class="field">
        <label class="field-label" for="content">Link or text</label>
        <textarea id="content" rows="2" spellcheck="false" autocomplete="off" placeholder="Paste a link or enter text">https://longanancial.com</textarea>
      </div>
      <div class="actions">
        <button id="pngBtn" class="button primary" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>Download PNG
        </button>
        <button id="svgBtn" class="button secondary" type="button">SVG</button>
      </div>
      <p class="error" id="error" role="alert"></p>

      <div class="customize">
        <button class="disclosure" id="customizeToggle" aria-controls="customizePanel" aria-expanded="false" type="button">
          <span>Customize QR code</span>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.59 8.59 12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>
        </button>
        <div class="expandable" id="customizePanel" aria-hidden="true" inert>
          <div class="expandable-inner">
            <div class="custom-panel">
              <div class="setting-row">
                <span class="setting-label">Center logo</span>
                <span class="minor">Optional</span>
              </div>
              <button class="logo-picker" id="logoPicker" type="button">
                <span class="logo-thumb" id="logoThumb"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13v6H5V5h6V3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-6h-2zM14 3v2h3.59l-8.83 8.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg></span>
                <span><strong id="logoLabel">Choose a logo</strong><small id="logoHint">PNG, JPG or SVG · up to 3 MB</small></span>
              </button>
              <input id="logoFile" class="sr-only" type="file" accept="image/png,image/jpeg,image/svg+xml,.svg" tabindex="-1">
              <button class="remove" id="removeLogo" type="button">Remove logo</button>

              <div class="more">
                <button class="disclosure" id="moreToggle" aria-controls="morePanel" aria-expanded="false" type="button">
                  <span>More options</span>
                  <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.59 8.59 12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>
                </button>
                <div class="expandable" id="morePanel" aria-hidden="true" inert>
                  <div class="expandable-inner">
                    <div class="advanced">
                      <div class="colors">
                        <div class="color-field"><label for="fg">QR color</label><input id="fg" type="color" value="#000000" aria-label="QR code color"></div>
                        <div class="color-field"><label for="bg">Background</label><input id="bg" type="color" value="#ffffff" aria-label="QR background color"></div>
                      </div>
                      <button class="reset" id="resetColors" type="button">Reset colors</button>
                      <p class="notice" id="contrastWarning">Low contrast may make this QR difficult to scan. Use a darker code and lighter background.</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div class="signature">by <a href="https://longanancial.com" target="_blank" rel="noopener noreferrer">LonGanancial</a></div>
  </div>
</main>
<div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true">
  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path id="toastIcon" d="M9 16.17 4.83 12 3.41 13.41 9 19l12-12-1.41-1.41z"/></svg>
  <span id="toastText">Done</span>
</div>

<script src="app.js" defer></script>
</body>
</html>
